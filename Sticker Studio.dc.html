<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#F7F4EF">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Oswald:wght@300;400;500&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#EFEBE4;font-family:'Archivo',system-ui,sans-serif;color:#14120F;overscroll-behavior:none}
input,button{font-family:inherit}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:#CFC8BC;border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-10px;border-radius:50%;background:#14120F;border:3px solid #F7F4EF;box-shadow:0 1px 4px rgba(0,0,0,.25)}
a{color:#14120F}a:hover{color:#8A6A3B}
</style>
</helmet>

<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#F7F4EF"/><g stroke="#14120F" stroke-width="2.4"><path d="M18 50h14M68 50h14"/></g><text x="50" y="58" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#14120F" text-anchor="middle">S</text></svg></template>

<div style="min-height:100dvh;background:#F7F4EF;max-width:480px;margin:0 auto;display:flex;flex-direction:column;box-shadow:0 0 60px rgba(20,18,15,.08)">

  <header style="display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;gap:12px">
    <div style="display:flex;flex-direction:column;gap:2px">
      <span style="font:600 16px/1 'Archivo',sans-serif;letter-spacing:.22em;text-transform:uppercase">Sticker</span>
      <span style="font:300 10px/1 'JetBrains Mono',monospace;letter-spacing:.14em;color:#8A8377;text-transform:uppercase">transparent png · stories</span>
    </div>
    <button onClick="{{ togglePresets }}" style="border:1px solid #DAD3C7;background:#FFFDF9;border-radius:999px;height:38px;padding:0 16px;font:500 12px/1 'Archivo',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#14120F">Presets</button>
  </header>

  <div style="position:relative;margin:0 14px;border-radius:18px;overflow:hidden;background:#E4DED3;aspect-ratio:9/13;background-size:cover;background-position:center;background-image:{{ stageBg }}">
    <div style="position:absolute;inset:0;background-image:linear-gradient(45deg,#00000008 25%,transparent 25%,transparent 75%,#00000008 75%),linear-gradient(45deg,#00000008 25%,transparent 25%,transparent 75%,#00000008 75%);background-size:22px 22px;background-position:0 0,11px 11px;opacity:{{ checkerOpacity }}"></div>
    <canvas ref="{{ canvasRef }}" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab"></canvas>
    <label style="position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;background:rgba(20,18,15,.62);backdrop-filter:blur(8px);color:#fff;font:500 11px/1 'Archivo',sans-serif;letter-spacing:.1em;text-transform:uppercase">
      <input type="file" accept="image/*" onChange="{{ onPhoto }}" style="display:none">
      {{ photoLabel }}
    </label>
    <span style="position:absolute;right:12px;bottom:12px;font:300 10px/1 'JetBrains Mono',monospace;letter-spacing:.1em;color:rgba(255,255,255,.75);text-shadow:0 1px 3px rgba(0,0,0,.5);text-transform:uppercase">drag to place</span>
  </div>

  <div style="display:flex;flex-direction:column;gap:18px;padding:18px 16px 8px">

    <div style="display:flex;flex-direction:column;gap:8px">
      <input value="{{ text }}" onInput="{{ onText }}" placeholder="Sigiriya" style="width:100%;height:52px;border:1px solid #DAD3C7;border-radius:12px;background:#FFFDF9;padding:0 16px;font:500 18px/1 'Archivo',sans-serif;letter-spacing:.06em;color:#14120F;outline:none">
      <sc-if value="{{ showSub }}" hint-placeholder-val="{{ true }}">
        <input value="{{ sub }}" onInput="{{ onSub }}" placeholder="Sri Lanka" style="width:100%;height:44px;border:1px solid #DAD3C7;border-radius:12px;background:#FFFDF9;padding:0 16px;font:400 14px/1 'Archivo',sans-serif;letter-spacing:.06em;color:#5C564C;outline:none">
      </sc-if>
    </div>

    <div style="display:flex;flex-direction:column;gap:9px">
      <span style="font:300 10px/1 'JetBrains Mono',monospace;letter-spacing:.16em;color:#8A8377;text-transform:uppercase">Layout</span>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <sc-for list="{{ layouts }}" as="l" hint-placeholder-count="5">
          <button onClick="{{ l.pick }}" style="border:1px solid {{ l.bd }};background:{{ l.bg }};color:{{ l.fg }};border-radius:999px;height:38px;padding:0 15px;font:500 12px/1 'Archivo',sans-serif;letter-spacing:.06em">{{ l.label }}</button>
        </sc-for>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:9px">
      <span style="font:300 10px/1 'JetBrains Mono',monospace;letter-spacing:.16em;color:#8A8377;text-transform:uppercase">Typeface</span>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <sc-for list="{{ fonts }}" as="f" hint-placeholder-count="5">
          <button onClick="{{ f.pick }}" style="border:1px solid {{ f.bd }};background:{{ f.bg }};color:{{ f.fg }};border-radius:999px;height:38px;padding:0 15px;font-size:14px;letter-spacing:.04em;font-family:{{ f.stack }}">{{ f.label }}</button>
        </sc-for>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:9px">
      <span style="font:300 10px/1 'JetBrains Mono',monospace;letter-spacing:.16em;color:#8A8377;text-transform:uppercase">Colour</span>
      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
        <sc-for list="{{ colors }}" as="c" hint-placeholder-count="7">
          <button onClick="{{ c.pick }}" style="width:34px;height:34px;border-radius:50%;border:1px solid #C9C1B4;background:{{ c.hex }};box-shadow:{{ c.ring }}"></button>
        </sc-for>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:14px">
      <span style="font:300 10px/1 'JetBrains Mono',monospace;letter-spacing:.16em;color:#8A8377;text-transform:uppercase;width:38px">Size</span>
      <input type="range" min="34" max="130" step="1" value="{{ size }}" onInput="{{ onSize }}" style="flex:1;height:22px">
      <span style="font:400 12px/1 'JetBrains Mono',monospace;color:#5C564C;width:34px;text-align:right">{{ sizeLabel }}</span>
    </div>

    <button onClick="{{ toggleGlow }}" style="display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;height:52px;padding:0 16px;border:1px solid #DAD3C7;border-radius:12px;background:#FFFDF9;text-align:left">
      <span style="display:flex;flex-direction:column;gap:3px">
        <span style="font:500 13px/1 'Archivo',sans-serif;color:#14120F">Legibility shadow</span>
        <span style="font:400 11px/1 'Archivo',sans-serif;color:#8A8377">Soft drop shadow for busy photos</span>
      </span>
      <span style="width:46px;height:27px;border-radius:999px;background:{{ glowTrack }};position:relative;flex:none;transition:background .18s">
        <span style="position:absolute;top:3px;left:{{ glowKnob }};width:21px;height:21px;border-radius:50%;background:#FFFDF9;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .18s"></span>
      </span>
    </button>

  </div>

  <div style="position:sticky;bottom:0;display:flex;flex-direction:column;gap:8px;padding:12px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(#F7F4EF00,#F7F4EF 22%)">
    <div style="display:flex;gap:10px">
      <button onClick="{{ download }}" style="flex:2;height:56px;border:none;border-radius:14px;background:#14120F;color:#F7F4EF;font:600 13px/1 'Archivo',sans-serif;letter-spacing:.14em;text-transform:uppercase">Download PNG</button>
      <button onClick="{{ copy }}" style="flex:1;height:56px;border:1px solid #DAD3C7;border-radius:14px;background:#FFFDF9;color:#14120F;font:600 13px/1 'Archivo',sans-serif;letter-spacing:.14em;text-transform:uppercase">Copy</button>
    </div>
    <span style="font:300 10px/1.4 'JetBrains Mono',monospace;letter-spacing:.08em;color:{{ statusColor }};text-align:center;text-transform:uppercase;min-height:14px">{{ status }}</span>
  </div>

  <sc-if value="{{ presetsOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;background:rgba(20,18,15,.42);display:flex;align-items:flex-end;justify-content:center;z-index:40" onClick="{{ togglePresets }}">
      <div onClick="{{ stop }}" style="width:100%;max-width:480px;background:#F7F4EF;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:78dvh;overflow:auto">
        <div style="width:38px;height:4px;border-radius:2px;background:#D6CFC3;margin:0 auto"></div>
        <span style="font:300 10px/1 'JetBrains Mono',monospace;letter-spacing:.16em;color:#8A8377;text-transform:uppercase">Saved presets</span>
        <div style="display:flex;flex-direction:column;gap:8px">
          <sc-for list="{{ presets }}" as="p" hint-placeholder-count="2">
            <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid #DAD3C7;border-radius:12px;background:#FFFDF9">
              <button onClick="{{ p.apply }}" style="flex:1;border:none;background:none;text-align:left;display:flex;flex-direction:column;gap:4px">
                <span style="font:500 14px/1 'Archivo',sans-serif;color:#14120F">{{ p.name }}</span>
                <span style="font:300 10px/1 'JetBrains Mono',monospace;letter-spacing:.1em;color:#8A8377;text-transform:uppercase">{{ p.meta }}</span>
              </button>
              <button onClick="{{ p.remove }}" style="border:none;background:none;font:400 12px/1 'JetBrains Mono',monospace;color:#B0522F;letter-spacing:.08em;text-transform:uppercase">Del</button>
            </div>
          </sc-for>
          <sc-if value="{{ noPresets }}" hint-placeholder-val="{{ false }}">
            <span style="font:400 12px/1.5 'Archivo',sans-serif;color:#8A8377;padding:6px 2px">Nothing saved yet. Set up a sticker you like, then save it here.</span>
          </sc-if>
        </div>
        <div style="display:flex;gap:10px">
          <input value="{{ presetName }}" onInput="{{ onPresetName }}" placeholder="Preset name" style="flex:1;height:48px;border:1px solid #DAD3C7;border-radius:12px;background:#FFFDF9;padding:0 14px;font:400 14px/1 'Archivo',sans-serif;outline:none">
          <button onClick="{{ savePreset }}" style="height:48px;padding:0 20px;border:none;border-radius:12px;background:#14120F;color:#F7F4EF;font:600 12px/1 'Archivo',sans-serif;letter-spacing:.12em;text-transform:uppercase">Save</button>
        </div>
      </div>
    </div>
  </sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:900}}">
const FONTS = [
  { id: 'archivo', label: 'Archivo', stack: "'Archivo', sans-serif", weight: 500 },
  { id: 'helv', label: 'Helvetica', stack: "'Helvetica Neue', Helvetica, Arial, sans-serif", weight: 500 },
  { id: 'serif', label: 'Instrument', stack: "'Instrument Serif', Georgia, serif", weight: 400 },
  { id: 'oswald', label: 'Oswald', stack: "'Oswald', sans-serif", weight: 400 },
  { id: 'mono', label: 'JetBrains', stack: "'JetBrains Mono', ui-monospace, monospace", weight: 400 }
];
const COLORS = ['#FFFFFF', '#14120F', '#F2EAD9', '#E8A13A', '#C2694B', '#8B9C7A', '#1F2E4A'];
const LAYOUTS = [
  { id: 'rule', label: 'Rule', sub: false },
  { id: 'caption', label: 'Caption', sub: false },
  { id: 'subtitle', label: 'Subtitle', sub: true },
  { id: 'vertical', label: 'Vertical', sub: false },
  { id: 'stamp', label: 'Stamp', sub: true }
];
const DESIGN_W = 1080;
const STORE = 'stickr.presets.v1';

function ls(ctx, text, sp) {
  let w = 0;
  for (const ch of text) w += ctx.measureText(ch).width + sp;
  return text.length ? w - sp : 0;
}
function drawLS(ctx, text, cx, y, sp) {
  const w = ls(ctx, text, sp);
  let x = cx - w / 2;
  for (const ch of text) {
    ctx.fillText(ch, x, y);
    x += ctx.measureText(ch).width + sp;
  }
}

function layout(ctx, o) {
  const S = o.size;
  const f = FONTS.find(x => x.id === o.font) || FONTS[0];
  const setF = (mul, weight) => { ctx.font = (weight || f.weight) + ' ' + (S * mul) + 'px ' + f.stack; };
  const T = (o.text || 'Sigiriya').toUpperCase();
  const U = (o.sub || '').toUpperCase();

  if (o.layout === 'caption') {
    const sp = S * 0.34;
    setF(1);
    const w = ls(ctx, T, sp);
    return { w, h: S * 1.1, draw: (c, cx, cy) => { setF(1); c.fillStyle = o.color; c.textBaseline = 'middle'; drawLS(c, T, cx, cy, sp); } };
  }

  if (o.layout === 'rule') {
    const sp = S * 0.2;
    setF(1);
    const tw = ls(ctx, T, sp);
    const lineLen = S * 2.4, gap = S * 0.75, lw = Math.max(1, S * 0.045);
    return {
      w: tw + 2 * (gap + lineLen), h: S * 1.2,
      draw: (c, cx, cy) => {
        setF(1); c.fillStyle = o.color; c.textBaseline = 'middle';
        drawLS(c, T, cx, cy, sp);
        c.strokeStyle = o.color; c.lineWidth = lw; c.lineCap = 'butt';
        const x0 = cx - tw / 2 - gap, x1 = cx + tw / 2 + gap;
        c.beginPath();
        c.moveTo(x0 - lineLen, cy); c.lineTo(x0, cy);
        c.moveTo(x1, cy); c.lineTo(x1 + lineLen, cy);
        c.stroke();
      }
    };
  }

  if (o.layout === 'subtitle') {
    const sp = S * 0.16, sp2 = S * 0.3, subS = 0.28;
    setF(1, 600); const tw = ls(ctx, T, sp);
    setF(subS, 400); const sw = U ? ls(ctx, U, sp2) : 0;
    const gap = S * 0.44, h = S + (U ? gap + S * subS : 0);
    return {
      w: Math.max(tw, sw), h,
      draw: (c, cx, cy) => {
        const top = cy - h / 2;
        setF(1, 600); c.fillStyle = o.color; c.textBaseline = 'middle';
        drawLS(c, T, cx, top + S * 0.5, sp);
        if (U) { setF(subS, 400); c.globalAlpha = 0.85; drawLS(c, U, cx, top + S + gap + S * subS * 0.5, sp2); c.globalAlpha = 1; }
      }
    };
  }

  if (o.layout === 'vertical') {
    const chars = Array.from(T.replace(/\s+/g, ''));
    setF(1);
    const cw = chars.reduce((m, ch) => Math.max(m, ctx.measureText(ch).width), 0);
    const lh = S * 0.98;
    return {
      w: cw, h: chars.length * lh,
      draw: (c, cx, cy) => {
        setF(1); c.fillStyle = o.color; c.textBaseline = 'middle'; c.textAlign = 'center';
        const top = cy - (chars.length * lh) / 2;
        chars.forEach((ch, i) => c.fillText(ch, cx, top + lh * (i + 0.5)));
        c.textAlign = 'left';
      }
    };
  }

  // stamp
  const sp = S * 0.2, sp2 = S * 0.26, mainS = 0.86, subS = 0.26;
  const padX = S * 0.6, padY = S * 0.46, bw = Math.max(1.4, S * 0.055);
  setF(mainS, 600); const tw = ls(ctx, T, sp);
  setF(subS, 400); const sw = U ? ls(ctx, U, sp2) : 0;
  const divGap = U ? S * 0.55 : 0;
  const inner = tw + (U ? divGap * 2 + sw : 0);
  const W = inner + padX * 2, H = S * mainS + padY * 2;
  return {
    w: W, h: H,
    draw: (c, cx, cy) => {
      const x = cx - W / 2, y = cy - H / 2;
      c.strokeStyle = o.color; c.fillStyle = o.color; c.lineWidth = bw; c.textBaseline = 'middle';
      c.strokeRect(x + bw / 2, y + bw / 2, W - bw, H - bw);
      setF(mainS, 600);
      drawLS(c, T, x + padX + tw / 2, cy, sp);
      if (U) {
        const dx = x + padX + tw + divGap;
        c.save(); c.setLineDash([S * 0.11, S * 0.09]); c.lineWidth = Math.max(1, S * 0.03);
        c.beginPath(); c.moveTo(dx, y + padY * 0.55); c.lineTo(dx, y + H - padY * 0.55); c.stroke(); c.restore();
        setF(subS, 400); c.globalAlpha = 0.9;
        drawLS(c, U, dx + divGap + sw / 2, cy, sp2);
        c.globalAlpha = 1;
      }
    }
  };
}

class Component extends DCLogic {
  state = {
    text: 'Sigiriya', sub: 'Sri Lanka', layout: 'rule', font: 'archivo',
    color: '#FFFFFF', size: 68, glow: true, photo: '', fx: 0.5, fy: 0.82,
    presets: [], presetsOpen: false, presetName: '', status: '', statusTone: 'ok'
  };
  canvasRef = React.createRef();

  componentDidMount() {
    try {
      const raw = localStorage.getItem(STORE);
      if (raw) this.setState({ presets: JSON.parse(raw) });
    } catch (e) {}
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => this.paint());
    this._ro = new ResizeObserver(() => this.paint());
    if (this.canvasRef.current) this._ro.observe(this.canvasRef.current);
    this.bindDrag();
    this.paint();
    if ('serviceWorker' in navigator) {
      try { navigator.serviceWorker.register('./sw.js'); } catch (e) {}
    }
  }
  componentDidUpdate() { this.paint(); }
  componentWillUnmount() { if (this._ro) this._ro.disconnect(); }

  opts() {
    const s = this.state;
    return { text: s.text, sub: s.sub, layout: s.layout, font: s.font, color: s.color, size: s.size, glow: s.glow };
  }

  applyGlow(ctx, o) {
    if (!o.glow) return;
    ctx.shadowColor = 'rgba(0,0,0,0.45)';
    ctx.shadowBlur = o.size * 0.26;
    ctx.shadowOffsetY = o.size * 0.05;
  }

  paint() {
    const cv = this.canvasRef.current;
    if (!cv) return;
    const r = cv.getBoundingClientRect();
    if (!r.width) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.width = Math.round(r.width * dpr);
    cv.height = Math.round(r.height * dpr);
    const ctx = cv.getContext('2d');
    const k = r.width / DESIGN_W;
    ctx.setTransform(dpr * k, 0, 0, dpr * k, 0, 0);
    ctx.clearRect(0, 0, DESIGN_W, r.height / k);
    const o = this.opts();
    const L = layout(ctx, o);
    ctx.save();
    this.applyGlow(ctx, o);
    L.draw(ctx, this.state.fx * DESIGN_W, this.state.fy * (r.height / k));
    ctx.restore();
  }

  exportCanvas() {
    const probe = document.createElement('canvas').getContext('2d');
    const o = this.opts();
    const L = layout(probe, o);
    const pad = o.size * (o.glow ? 0.55 : 0.32);
    const EXP = 3;
    const cv = document.createElement('canvas');
    cv.width = Math.ceil((L.w + pad * 2) * EXP);
    cv.height = Math.ceil((L.h + pad * 2) * EXP);
    const ctx = cv.getContext('2d');
    ctx.scale(EXP, EXP);
    this.applyGlow(ctx, o);
    L.draw(ctx, L.w / 2 + pad, L.h / 2 + pad);
    return cv;
  }

  flash(msg, tone) {
    this.setState({ status: msg, statusTone: tone || 'ok' });
    clearTimeout(this._t);
    this._t = setTimeout(() => this.setState({ status: '' }), 2600);
  }

  bindDrag() {
    const cv = this.canvasRef.current;
    if (!cv) return;
    const move = e => {
      const r = cv.getBoundingClientRect();
      this.setState({
        fx: Math.min(0.95, Math.max(0.05, (e.clientX - r.left) / r.width)),
        fy: Math.min(0.96, Math.max(0.04, (e.clientY - r.top) / r.height))
      });
    };
    cv.addEventListener('pointerdown', e => {
      cv.setPointerCapture(e.pointerId);
      this._drag = true; move(e); e.preventDefault();
    });
    cv.addEventListener('pointermove', e => { if (this._drag) move(e); });
    const end = () => { this._drag = false; };
    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointercancel', end);
  }

  renderVals() {
    const s = this.state;
    const set = patch => this.setState(patch);
    const cur = LAYOUTS.find(l => l.id === s.layout) || LAYOUTS[0];
    return {
      text: s.text, sub: s.sub, size: s.size, sizeLabel: String(s.size),
      showSub: !!cur.sub,
      stageBg: s.photo ? 'url(' + s.photo + ')' : 'none',
      checkerOpacity: s.photo ? 0 : 1,
      photoLabel: s.photo ? 'Change photo' : 'Add photo',
      glowTrack: s.glow ? '#14120F' : '#D6CFC3',
      glowKnob: s.glow ? '22px' : '3px',
      status: s.status, statusColor: s.statusTone === 'err' ? '#B0522F' : '#5C564C',
      presetsOpen: s.presetsOpen, presetName: s.presetName, noPresets: s.presets.length === 0,
      canvasRef: this.canvasRef,
      layouts: LAYOUTS.map(l => ({
        label: l.label, pick: () => set({ layout: l.id }),
        bg: s.layout === l.id ? '#14120F' : '#FFFDF9',
        fg: s.layout === l.id ? '#F7F4EF' : '#14120F',
        bd: s.layout === l.id ? '#14120F' : '#DAD3C7'
      })),
      fonts: FONTS.map(f => ({
        label: f.label, stack: f.stack, pick: () => set({ font: f.id }),
        bg: s.font === f.id ? '#14120F' : '#FFFDF9',
        fg: s.font === f.id ? '#F7F4EF' : '#14120F',
        bd: s.font === f.id ? '#14120F' : '#DAD3C7'
      })),
      colors: COLORS.map(hex => ({
        hex, pick: () => set({ color: hex }),
        ring: s.color === hex ? '0 0 0 2px #F7F4EF, 0 0 0 4px #14120F' : 'none'
      })),
      presets: s.presets.map((p, i) => ({
        name: p.name,
        meta: p.layout + ' · ' + p.font + ' · ' + p.size,
        apply: () => set({ text: p.text, sub: p.sub, layout: p.layout, font: p.font, color: p.color, size: p.size, glow: p.glow, presetsOpen: false }),
        remove: () => {
          const next = s.presets.filter((_, j) => j !== i);
          this.setState({ presets: next });
          try { localStorage.setItem(STORE, JSON.stringify(next)); } catch (e) {}
        }
      })),
      onText: e => set({ text: e.target.value }),
      onSub: e => set({ sub: e.target.value }),
      onSize: e => set({ size: Number(e.target.value) }),
      onPresetName: e => set({ presetName: e.target.value }),
      toggleGlow: () => set({ glow: !s.glow }),
      togglePresets: () => set({ presetsOpen: !s.presetsOpen }),
      stop: e => e.stopPropagation(),
      onPhoto: e => {
        const f = e.target.files && e.target.files[0];
        if (f) set({ photo: URL.createObjectURL(f) });
      },
      savePreset: () => {
        const name = (s.presetName || '').trim() || (s.text || 'Preset');
        const next = s.presets.concat([{ name, text: s.text, sub: s.sub, layout: s.layout, font: s.font, color: s.color, size: s.size, glow: s.glow }]);
        this.setState({ presets: next, presetName: '' });
        try { localStorage.setItem(STORE, JSON.stringify(next)); } catch (e) {}
        this.flash('Preset saved');
      },
      download: () => {
        const cv = this.exportCanvas();
        cv.toBlob(b => {
          const url = URL.createObjectURL(b);
          const a = document.createElement('a');
          a.href = url;
          a.download = (s.text || 'sticker').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.png';
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 4000);
          this.flash('PNG downloaded · ' + cv.width + '×' + cv.height);
        }, 'image/png');
      },
      copy: () => {
        const cv = this.exportCanvas();
        cv.toBlob(async b => {
          try {
            await navigator.clipboard.write([new ClipboardItem({ 'image/png': b })]);
            this.flash('Copied to clipboard');
          } catch (err) {
            this.flash('Copy blocked — use download', 'err');
          }
        }, 'image/png');
      }
    };
  }
}

</script>
</body>
